name: Verify bookmark extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install isolated Chromium test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run scan:secrets
      - run: node scripts/scan-secrets.mjs --history
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-tidy-0.1.0
          path: |
            dist/bookmark-tidy-0.1.0/
            dist/bookmark-tidy-0.1.0.zip
            dist/bookmark-tidy-0.1.0.sha256
